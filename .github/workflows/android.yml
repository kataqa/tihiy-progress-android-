
name: Build Android APK

on:
  workflow_dispatch:
  push:
    branches:
      - main

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Extract Android project
        run: unzip -o TihiyProgress-Android.zip

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3
        with:
          packages: "platform-tools platforms;android-35 build-tools;35.0.0"

      - name: Install Android SDK packages
        run: sdkmanager "platforms;android-35" "build-tools;35.0.0"

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.11.1'

      - name: Align Java and Kotlin versions
        run: |
          python - <<'PY'
          from pathlib import Path
          p = Path("TihiyProgress/app/build.gradle.kts")
          s = p.read_text()
          s = s.replace(
              "android {",
              "android {\n    compileOptions {\n        sourceCompatibility = JavaVersion.VERSION_17\n        targetCompatibility = JavaVersion.VERSION_17\n    }",
              1
          )
          p.write_text(s)
          PY    

      - name: Build debug APK
        run: gradle -p TihiyProgress :app:assembleDebug

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: tihiy-progress-debug-apk
          path: TihiyProgress/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
